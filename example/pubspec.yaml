name: example
description: "The flutter_table_plus example: a recipe browser, a viewport preview, two scenarios and a playground."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  # Named rather than inherited, because the dependencies below set it. The
  # shell declares `>=3.27.0`, measured at both ends by its own CI rather than by
  # the SDK that happened to build it; the root package declares `>=3.32.0`, so
  # the higher of the two is what this app can actually be built with.
  flutter: ">=3.32.0"


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.17
  flutter_table_plus:
    path: ../

  # The shell this example is drawn in — the menu, the preview stage, the device
  # wall, the Code pane and the settings panel. It used to be `lib/gallery/`
  # here, a directory laid out as the package it was going to be and held to
  # that by a seam test, because all three of its rules are legal Dart and
  # nothing but a rule caught a violation. It is that package now, so the rules
  # are the compiler's.
  #
  # A hosted version rather than a `path:` to the sibling checkout, matching how
  # the root package consumes `just_tooltip` and `flutter_checkbox`. `example/`
  # is a gate, and a gate that only resolves on a machine holding a second
  # checkout is a gate a fresh clone cannot run.
  flutter_example_template: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Already in the tree, under the shell. Named here because one guard reaches
  # for it directly: the Code pane's monospace test walks every token kind, and
  # its own comment records why — a fixture that does not reach a branch does
  # not guard that branch, and the branch it missed is the one #123 shipped. A
  # transitive dependency is not importable, so the alternative was to weaken
  # the assertion the guard exists for.
  flutter_syntax_highlight: ^0.1.0

  # Already in the tree, under flutter_table_plus. Named here for one test:
  # test/recipes_d_test.dart reads a motion's duration and bounce, and the
  # barrel re-exports `WheelMotion` alone, so its variants are importable only
  # from the package that declares them.
  flutter_smooth_wheel_scroll: ^0.1.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    # A recipe's own source, bundled so the app can read back the file it is
    # running rather than a copy pasted into a string. What is on screen and
    # what executes cannot disagree if they are the same bytes.
    - lib/recipes/
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.ttf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.ttf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.ttf
          weight: 700
