name: flutter_table_plus
description: "A highly customizable and efficient table widget for Flutter, featuring synchronized scrolling, theming, sorting, selection, column reordering, hover buttons, and expandable rows."
version: 2.15.2
homepage: https://github.com/kihyun1998/flutter_table_plus
repository: https://github.com/kihyun1998/flutter_table_plus
topics:
  - table
  - datatable
  - data-table
  - grid
  - datagrid

# Raised from Dart 3.0.0 / Flutter 3.10.0 by just_tooltip 0.4.2, whose ancestor
# clip walk reads `RenderObject.parent`. That was `AbstractNode?` — a type with
# no `describeApproximatePaintClip` — until Flutter 3.13. Our `^0.4.0` already
# resolved 0.4.2, so the old floor had quietly become a promise we could not
# keep; raising it is the honest fix, not the cause. 0.4.3 keeps the same floor.
environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_checkbox: ^0.2.1
  just_tooltip: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1
  benchmark_harness: ^2.3.1

flutter:
