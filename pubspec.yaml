name: flutter_table_plus
description: "A highly customizable and efficient table widget for Flutter, featuring synchronized scrolling, theming, sorting, selection, column reordering, hover buttons, and expandable rows."
version: 2.16.2
homepage: https://github.com/kihyun1998/flutter_table_plus
repository: https://github.com/kihyun1998/flutter_table_plus
topics:
  - table
  - datatable
  - data-table
  - grid
  - datagrid

# The binding floor is the max of what our two bindings demand: flutter_checkbox
# 0.3.1 declares Flutter `>=3.27.0` / Dart `>=3.6.0` (its newest call is
# `Color.withValues`, 3.27+; everything else needs only Dart 3.0), and
# just_tooltip 0.4.4 declares Flutter `>=3.13.0` / Dart `>=3.1.0` (its
# `RenderObject.parent` ancestor walk needs `describeApproximatePaintClip`, added
# in 3.13). So the honest floor is `max(3.27, 3.13) = 3.27` / `max(3.6, 3.1) = 3.6`.
#
# 0.3.0 had over-declared its floor as 3.35 — the SDK it was built with, not the
# one its code needs — and taking `^0.3.0` made that 3.35 our transitive
# requirement (that was the 2.16.0 raise). 0.3.1 corrected it down to 3.27, so
# this declaration is free to follow. The constraint is `^0.3.1`, not `^0.3.0`:
# `^0.3.0` still admits 0.3.0, whose 3.35 floor a 3.27 user could not satisfy —
# the declared range must be a promise we can keep for every version the
# constraint allows, the same honesty the 3.35 raise served, run in reverse.
environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_checkbox: ^0.3.1
  # 0.4.4 is a floor, not a preference: it stops a tooltip with nothing to draw
  # from suppressing the row card, which this package used to do itself by not
  # building such a tooltip at all. That guard is gone, so 0.4.3 would reissue
  # the bug (#88) rather than merely miss the fix.
  just_tooltip: ^0.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.1
  benchmark_harness: ^2.3.1

flutter:
